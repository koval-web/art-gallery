<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея Искусств</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Галерея Искусств</h1>
        <p>Чистое вдохновение в каждой линии</p>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все работы</button>
            <button class="filter-btn" data-filter="landscape">Пейзажи</button>
            <button class="filter-btn" data-filter="portrait">Портреты</button>
            <button class="filter-btn" data-filter="abstract">Абстракция</button>
        </div>
    </header>

    <main>
        <div class="gallery-grid">
            <div class="gallery-item" data-category="landscape">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Пейзаж">
            </div>
            <div class="gallery-item" data-category="landscape">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Природа">
            </div>
            <div class="gallery-item" data-category="abstract">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23" alt="Абстракция">
            </div>
            <div class="gallery-item" data-category="landscape">
                <img src="https://images.unsplash.com/photo-1426604966848-d7adacbd02bff" alt="Городской пейзаж">
            </div>
            <div class="gallery-item" data-category="portrait">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Дорога">
            </div>
            <div class="gallery-item" data-category="portrait">
                <img src="https://images.unsplash.com/photo-1561731216-c3a4d99437d5" alt="Портрет / Медведь">
            </div>
        </div>
    </main>

    <footer style="text-align: center; margin-top: 60px; color: #777;">
        <p>О художнике</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
